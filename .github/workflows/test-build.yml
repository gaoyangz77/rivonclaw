name: Test Build (No Signing)

# Test build workflow without code signing
# Runs on every push to main to ensure builds don't break

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Checkout merchant extensions
        uses: actions/checkout@v5
        with:
          repository: gaoyangz77/rivonclaw-merchant-extensions
          token: ${{ secrets.PRIVATE_EXTENSIONS_PAT }}
          path: extensions-merchant

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup OpenClaw vendor
        shell: bash
        run: ./scripts/setup-vendor.sh

      # Cloned by hand rather than by the script, because the caches below key
      # on the vendor lockfile and must restore into an already-cloned tree —
      # git clone refuses a directory that a restored node_modules made non-empty.
      - name: Clone Pixel Agents vendor
        shell: bash
        run: |
          HASH=$(tr -d '[:space:]' < .pixel-agents-version)
          git clone https://github.com/pixel-agents-hq/pixel-agents.git vendor/pixel-agents
          cd vendor/pixel-agents
          git checkout "$HASH"
          git checkout -B main

      - name: Cache Pixel Agents node_modules
        id: cache-pixel-nm
        uses: actions/cache@v4
        with:
          path: vendor/pixel-agents/node_modules
          key: pixel-nm-${{ runner.os }}-${{ hashFiles('.pixel-agents-version') }}-${{ hashFiles('vendor/pixel-agents/package-lock.json') }}
          restore-keys: |
            pixel-nm-${{ runner.os }}-${{ hashFiles('.pixel-agents-version') }}-

      - name: Cache Pixel Agents dist
        id: cache-pixel-dist
        uses: actions/cache@v4
        with:
          path: vendor/pixel-agents/dist
          key: pixel-dist-${{ runner.os }}-${{ hashFiles('.pixel-agents-version') }}-${{ hashFiles('vendor-patches/pixel-agents/*.patch', 'scripts/setup-pixel-agents.sh') }}

      # Stages apps/desktop/build/office/, which is the Panel's Vite publicDir —
      # so it must run before the Panel is built, not before it is packaged.
      - name: Provision Pixel Agents office
        shell: bash
        run: ./scripts/setup-pixel-agents.sh --skip-clone
        env:
          SKIP_PIXEL_AGENTS_INSTALL: ${{ steps.cache-pixel-nm.outputs.cache-hit }}
          SKIP_PIXEL_AGENTS_BUILD: ${{ steps.cache-pixel-dist.outputs.cache-hit }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Test Windows PATH and dependency provisioning
        run: |
          pnpm --dir packages/gateway exec vitest run src/path-env.windows.test.ts src/utils/cli-utils.test.ts src/runtime/launcher.test.ts
          pnpm --dir apps/desktop exec vitest run src/deps/__tests__/dep-detector.test.ts src/deps/__tests__/dep-installer.test.ts

      - name: Test Windows build (no signing)
        run: |
          cd apps/desktop
          pnpm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

  test-build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout merchant extensions
        uses: actions/checkout@v5
        with:
          repository: gaoyangz77/rivonclaw-merchant-extensions
          token: ${{ secrets.PRIVATE_EXTENSIONS_PAT }}
          path: extensions-merchant

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup OpenClaw vendor
        run: ./scripts/setup-vendor.sh

      # Cloned by hand rather than by the script, because the caches below key
      # on the vendor lockfile and must restore into an already-cloned tree —
      # git clone refuses a directory that a restored node_modules made non-empty.
      - name: Clone Pixel Agents vendor
        run: |
          HASH=$(tr -d '[:space:]' < .pixel-agents-version)
          git clone https://github.com/pixel-agents-hq/pixel-agents.git vendor/pixel-agents
          cd vendor/pixel-agents
          git checkout "$HASH"
          git checkout -B main

      - name: Cache Pixel Agents node_modules
        id: cache-pixel-nm
        uses: actions/cache@v4
        with:
          path: vendor/pixel-agents/node_modules
          key: pixel-nm-${{ runner.os }}-${{ hashFiles('.pixel-agents-version') }}-${{ hashFiles('vendor/pixel-agents/package-lock.json') }}
          restore-keys: |
            pixel-nm-${{ runner.os }}-${{ hashFiles('.pixel-agents-version') }}-

      - name: Cache Pixel Agents dist
        id: cache-pixel-dist
        uses: actions/cache@v4
        with:
          path: vendor/pixel-agents/dist
          key: pixel-dist-${{ runner.os }}-${{ hashFiles('.pixel-agents-version') }}-${{ hashFiles('vendor-patches/pixel-agents/*.patch', 'scripts/setup-pixel-agents.sh') }}

      # Stages apps/desktop/build/office/, which is the Panel's Vite publicDir —
      # so it must run before the Panel is built, not before it is packaged.
      - name: Provision Pixel Agents office
        run: ./scripts/setup-pixel-agents.sh --skip-clone
        env:
          SKIP_PIXEL_AGENTS_INSTALL: ${{ steps.cache-pixel-nm.outputs.cache-hit }}
          SKIP_PIXEL_AGENTS_BUILD: ${{ steps.cache-pixel-dist.outputs.cache-hit }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Test macOS build (no signing)
        run: |
          cd apps/desktop
          pnpm run pack:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Validate macOS bundle
        run: |
          APP=$(find apps/desktop/release -name "*.app" -maxdepth 3 | head -1)
          VENDOR="$APP/Contents/Resources/vendor/openclaw"
          test -f "$VENDOR/vendor-runtime.tar" || { echo "FAIL: archive missing"; exit 1; }
          test ! -d "$VENDOR/node_modules" || { echo "FAIL: exploded node_modules in bundle"; exit 1; }
          FILE_COUNT=$(find "$VENDOR" -type f | wc -l)
          echo "Vendor dir: $FILE_COUNT files"
          test "$FILE_COUNT" -le 10 || { echo "FAIL: >10 files in vendor dir"; exit 1; }
          echo "PASS"
